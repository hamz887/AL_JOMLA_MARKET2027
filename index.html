<div id="md"></div>
<script>
window.alert=m=>{const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)};
const $=s=>document.querySelector(s),g=k=>$('#f_'+k).value,h=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const F=n=>{n=Math.round(n||0);return(n<0?'\u200e-':'')+Math.abs(n).toLocaleString('en-US')};
const DY=['السبت','الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'],ST_={p:'حاضر',a:'غائب',l:'إجازة'};
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),today=()=>iso(new Date());
const nowT=()=>new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true}).replace('AM','ص').replace('PM','م');
const tick=()=>{const d=$('#dt');if(d)d.textContent=DY[(new Date().getDay()+1)%7]+' '+today()+' - '+nowT()};setInterval(tick,15000);
const add=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)};
const wk=s=>add(s,-((new Date(s+'T12:00').getDay()+1)%7)),wkDays=w=>[0,1,2,3,4,5,6].map(i=>add(w,i));
const sum=(a,k='amt')=>a.reduce((x,y)=>x+(+y[k]||0),0),hs=s=>{let x=5381;for(const c of s+'#dw')x=(x*33^c.charCodeAt(0))>>>0;return''+x};
/* ===== قاعدة البيانات IndexedDB ===== */
let db,S={emp:[],att:[],wd:[],buy:[],adj:[],pay:[],cfg:[]},pg='home',W=wk(today()),tab='wd',EQ='',TQ='';
const ST=Object.keys(S),AUTO=['emp','wd','buy','adj'];
const open=()=>new Promise(r=>{const q=indexedDB.open('payroll',1);q.onupgradeneeded=()=>ST.forEach(s=>q.result.createObjectStore(s,{keyPath:'id',autoIncrement:AUTO.includes(s)}));q.onsuccess=()=>{db=q.result;r()}});
const tx=(s,m)=>db.transaction(s,m).objectStore(s);
const all=s=>new Promise(r=>{tx(s,'readonly').getAll().onsuccess=e=>r(e.target.result)});
const put=(s,o)=>new Promise(r=>{tx(s,'readwrite').put(o).onsuccess=r});
const del=(s,k)=>new Promise(r=>{tx(s,'readwrite').delete(k).onsuccess=r});
const load=async()=>{for(const s of ST)S[s]=await all(s)};
const cf=k=>S.cfg.find(x=>x.id==k)?.v,sc=async(k,v)=>{await put('cfg',{id:k,v});S.cfg=await all('cfg')};
const A=(e,d)=>S.att.find(a=>a.id==e+'|'+d),nm=id=>S.emp.find(e=>e.id==id)?.name||'—',act=()=>S.emp.filter(e=>e.act!==false);
/* ===== الحسابات ===== */
function calc(e,w){const r=wkDays(w).map(d=>A(e.id,d)).filter(Boolean),f=x=>x.filter(y=>y.emp==e.id&&y.date>=w&&y.date<=add(w,6)),
wd=f(S.wd),by=f(S.buy),ad=f(S.adj),ex=ad.filter(x=>x.t=='+'),dd=ad.filter(x=>x.t=='-'),P=r.filter(x=>x.st=='p');
const o={pr:P.length,ab:r.filter(x=>x.st=='a').length,lv:r.filter(x=>x.st=='l').length,wages:sum(P,'rate'),wdL:wd,byL:by,exL:ex,ddL:dd,wd:sum(wd),by:sum(by),ex:sum(ex),dd:sum(dd)};
o.net0=o.wages+o.ex-o.wd-o.by-o.dd;return o}
function bal(e,w){let b=0;for(let x=wk(e.start||w);x<w;x=add(x,7)){const p=S.pay.find(y=>y.id==e.id+'|'+x);b=calc(e,x).net0+b-(p?p.paid:0)}return b}
/* ===== واجهة عامة ===== */
const PG={home:['📊','لوحة التحكم'],att:['🗓️','الدوام'],emp:['👥','الموظفون'],tx:['💸','السحوبات والمشتريات'],acc:['🧾','الحساب والوصل'],stat:['📉','الإحصائيات'],rep:['📈','التقارير والبحث'],set:['⚙️','الإعدادات والنسخ']};
function go(p){const ch=p&&p!=pg;pg=p||pg;$('nav').innerHTML=Object.entries(PG).map(([k,v])=>`<a class="${k==pg?'on':''}" onclick="go('${k}')">${v[0]} ${v[1]}</a>`).join('');$('main').className=ch?'in':'';tick();$('main').innerHTML=({home:pHome,att:pAtt,emp:pEmp,tx:pTx,acc:pAcc,stat:pStat,rep:pRep,set:pSet})[pg]()}
const modal=(t,b,f)=>$('#md').innerHTML=`<div class="mb" onclick="if(event.target==this)cl()"><div class="mc"><h3 class="np">${t}</h3>${b}<div class="ft np">${f}</div></div></div>`,cl=()=>$('#md').innerHTML='';
const fld=(k,l,t='text',v='',o)=>`<label>${l}${t=='select'?`<select id="f_${k}">${o.map(x=>`<option value="${x[0]}"${x[0]==v?' selected':''}>${h(x[1])}</option>`).join('')}</select>`:t=='area'?`<textarea id="f_${k}">${h(v)}</textarea>`:`<input id="f_${k}" type="${t}" value="${h(v)}">`}</label>`;
const wn=()=>`<div class="bar np"><button class="sm b5" onclick="sw(-7)">▶ السابق</button><b>${W} ← ${add(W,6)}</b><button class="sm b5" onclick="sw(7)">التالي ◀</button><input type="date" onchange="sw(0,this.value)" title="انتقال إلى تاريخ"><button class="sm b4" onclick="W=wk(today());go()">هذا الأسبوع</button></div>`;
const sw=(n,d)=>{if(d||!n)W=d?wk(d):W;else W=add(W,n);go()};
/* ===== لوحة التحكم ===== */
function pHome(){const t=today(),w=wk(t),E=act();let pr=0,ab=0,tw=0,td=0,tb=0,tn=0,dbt=0;
const rows=E.map(e=>{const s=A(e.id,t)?.st,c=calc(e,w),b=bal(e,w),n=c.net0+b;if(b<0)dbt-=b;if(s=='p')pr++;if(s=='a')ab++;tw+=c.wages;td+=c.wd;tb+=c.by;tn+=n;
return`<tr><td><b>${h(e.name)}</b></td><td>${s?`<span class="pill s-${s}">${ST_[s]}</span>`:'—'}</td><td>${c.pr}</td><td>${F(c.wages)}</td><td>${F(c.wd)}</td><td>${F(c.by)}</td><td><b>${F(n)}</b></td></tr>`}).join('');
const bk=cf('bk'),old=!bk||(new Date(t)-new Date(bk))>6048e5;
return`<h2>لوحة التحكم</h2>${old?'<div class="warn">⚠️ لم تُنشأ نسخة احتياطية منذ أكثر من أسبوع. من «الإعدادات والنسخ» نزّل نسخة واحفظها في مكان آمن.</div>':''}
<div class="cards"><div class="c">عدد الموظفين<b>${E.length}</b></div><div class="c">الحاضرون اليوم<b>${pr}</b></div><div class="c">الغائبون اليوم<b>${ab}</b></div><div class="c">أجور هذا الأسبوع<b>${F(tw)}</b></div><div class="c">مجموع السحوبات<b>${F(td)}</b></div><div class="c">مشتريات الموظفين<b>${F(tb)}</b></div><div class="c">صافي المستحق للجميع<b>${F(tn)}</b></div><div class="c">ديون مرحّلة على الموظفين<b>${F(dbt)}</b></div></div>
<div class="box"><table><tr><th>الموظف</th><th>اليوم</th><th>أيام الحضور</th><th>الأجور</th><th>السحوبات</th><th>المشتريات</th><th>الصافي</th></tr>${rows||'<tr><td colspan="7">ابدأ بإضافة الموظفين من صفحة «الموظفون»</td></tr>'}</table></div>`}
/* ===== الموظفون ===== */
function pEmp(){return`<h2>الموظفون</h2><div class="bar"><button class="b2" onclick="empForm()">+ إضافة موظف</button><input placeholder="🔍 بحث باسم الموظف ثم Enter" value="${h(EQ)}" onchange="EQ=this.value;go()"></div><div class="box"><table><tr><th>الاسم</th><th>الهاتف</th><th>الأجر اليومي</th><th>بدء العمل</th><th>ملاحظات</th><th>الحالة</th><th></th></tr>${S.emp.filter(e=>e.name.includes(EQ.trim())).map(e=>`<tr><td><b>${h(e.name)}</b></td><td>${h(e.phone)}</td><td>${F(e.rate)}</td><td>${e.start}</td><td>${h(e.note)}</td><td><span class="pill ${e.act!==false?'s-p':'s-a'}">${e.act!==false?'فعّال':'موقوف'}</span></td><td><button class="sm" onclick="empForm(${e.id})">تعديل</button> <button class="sm b4" onclick="tgE(${e.id})">${e.act!==false?'إيقاف':'تفعيل'}</button> <button class="sm b3" onclick="dE(${e.id})">حذف</button></td></tr>`).join('')||'<tr><td colspan="7">لا يوجد موظفون بعد</td></tr>'}</table></div>`}
function empForm(id){const o=id?S.emp.find(e=>e.id==id):{};modal(id?'تعديل موظف':'إضافة موظف',fld('n','الاسم الكامل','text',o.name)+fld('p','رقم الهاتف (اختياري)','tel',o.phone)+fld('r','الأجر اليومي (دينار)','number',o.rate)+fld('s','تاريخ بدء العمل','date',o.start||today())+fld('t','ملاحظات','area',o.note),`<button class="b2" onclick="svE(${id||0})">حفظ</button><button class="b5" onclick="cl()">إلغاء</button>`)}
async function svE(id){const o=id?S.emp.find(e=>e.id==id):{act:true};Object.assign(o,{name:g('n').trim(),phone:g('p'),rate:+g('r'),start:g('s'),note:g('t')});if(!o.name||!(o.rate>0)||!o.start)return alert('أدخل الاسم والأجر اليومي وتاريخ البدء');await put('emp',o);await load();cl();go()}
async function tgE(id){const o=S.emp.find(e=>e.id==id);o.act=o.act===false;await put('emp',o);await load();go()}
async function dE(id){if(!confirm('سيتم حذف الموظف وجميع سجلاته نهائياً. الأفضل «إيقاف» الموظف بدل حذفه. متابعة؟'))return;for(const s of ST.filter(s=>s!='emp'&&s!='cfg'))for(const x of S[s].filter(x=>x.emp==id))await del(s,x.id);await del('emp',id);await load();go()}
/* ===== الدوام ===== */
function pAtt(){const ds=wkDays(W);return`<h2>الدوام الأسبوعي</h2>${wn()}<div class="box"><table><tr><th>الموظف</th>${ds.map((d,i)=>`<th>${DY[i]}<br><small>${d.slice(5)}</small><br><a style="cursor:pointer;color:#4338ca;font-size:0.6875rem" onclick="allp('${d}')">الكل حاضر</a></th>`).join('')}<th>الحضور</th><th>الأجر</th></tr>${act().map(e=>{const c=calc(e,W);return`<tr><td><b>${h(e.name)}</b><br><small>${F(e.rate)}</small></td>${ds.map(d=>{const s=A(e.id,d)?.st;return`<td><button class="sm ${s?'s-'+s:''}" style="min-width:4.125rem;${s?'':'background:#e2e8f0;color:#64748b'}" onclick="tg(${e.id},'${d}')">${ST_[s]||'—'}</button></td>`}).join('')}<td>${c.pr}</td><td><b>${F(c.wages)}</b></td></tr>`}).join('')||'<tr><td colspan="10">أضف موظفين أولاً</td></tr>'}</table></div>`}
async function tg(id,d){const c=A(id,d),n={p:'a',a:'l',l:''}[c?.st]??'p';if(n)await put('att',{id:id+'|'+d,emp:id,date:d,st:n,rate:c?.rate||S.emp.find(x=>x.id==id).rate});else await del('att',id+'|'+d);await load();go()}
async function allp(d){for(const e of act())if(!A(e.id,d))await put('att',{id:e.id+'|'+d,emp:e.id,date:d,st:'p',rate:e.rate});await load();go()}
/* ===== السحوبات والمشتريات والاستحقاقات ===== */
const TT={wd:'السحوبات النقدية',buy:'مشتريات الموظفين',adj:'الاستحقاقات والخصومات'};
function pTx(){const r=S[tab].filter(x=>x.date>=W&&x.date<=add(W,6)&&nm(x.emp).includes(TQ.trim())).sort((a,b)=>a.date<b.date?-1:1);
return`<h2>السحوبات والمشتريات</h2><div class="bar">${Object.entries(TT).map(([k,v])=>`<button class="${k==tab?'':'b5'}" onclick="tab='${k}';go()">${v}</button>`).join('')}<button class="b2" onclick="txForm('${tab}')">+ إضافة</button><input placeholder="🔍 بحث باسم الموظف ثم Enter" value="${h(TQ)}" onchange="TQ=this.value;go()"></div>${wn()}<div class="box"><table><tr><th>التاريخ</th><th>الموظف</th><th>التفاصيل</th><th>المبلغ</th><th></th></tr>${r.map(x=>`<tr><td>${x.date}</td><td>${h(nm(x.emp))}</td><td>${tab=='buy'?h(x.item)+' × '+x.qty+' بسعر '+F(x.price):(tab=='adj'?(x.t=='+'?'➕ استحقاق: ':'➖ خصم: '):'')+h(x.reason)}${x.note?'<br><small>'+h(x.note)+'</small>':''}</td><td><b>${F(x.amt)}</b></td><td><button class="sm" onclick="txForm('${tab}',${x.id})">تعديل</button> <button class="sm b3" onclick="dl('${tab}',${x.id})">حذف</button></td></tr>`).join('')||'<tr><td colspan="5">لا توجد عمليات في هذا الأسبوع</td></tr>'}</table>${tab=='adj'?'':`<p style="margin-top:0.625rem"><b>المجموع: ${F(sum(r))}</b></p>`}</div>`}
function txForm(ty,id){const o=id?S[ty].find(x=>x.id==id):{},em=S.emp.filter(e=>e.act!==false||e.id==o.emp).map(e=>[e.id,e.name]);if(!em.length)return alert('أضف موظفاً أولاً');
let b=fld('e','الموظف','select',o.emp,em)+fld('d','التاريخ','date',o.date||today());
if(ty=='buy')b+=fld('i','اسم المادة','text',o.item)+fld('q','الكمية','number',o.qty||1)+fld('pr','سعر الوحدة','number',o.price);
else{if(ty=='adj')b+=fld('t','النوع','select',o.t,[['+','استحقاق إضافي'],['-','خصم']]);b+=fld('a','المبلغ','number',o.amt)+fld('r',ty=='wd'?'سبب السحب':'السبب','text',o.reason)}
modal(TT[ty],b+fld('n','ملاحظات','area',o.note),`<button class="b2" onclick="svTx('${ty}',${id||0})">حفظ</button><button class="b5" onclick="cl()">إلغاء</button>`)}
async function svTx(ty,id){const o=id?S[ty].find(x=>x.id==id):{};o.emp=+g('e');o.date=g('d');o.note=g('n');if(!o.time)o.time=nowT();
if(ty=='buy'){o.item=g('i');o.qty=+g('q');o.price=+g('pr');o.amt=o.qty*o.price}else{o.amt=+g('a');o.reason=g('r');if(ty=='adj')o.t=g('t')}
if(!o.date||!(o.amt>0))return alert('أكمل البيانات: التاريخ والمبلغ مطلوبان');await put(ty,o);await load();W=wk(o.date);cl();go()}
async function dl(s,id){if(confirm('حذف هذه العملية؟ سيُعاد احتساب الحساب تلقائياً.')){await del(s,id);await load();go()}}
/* ===== الحساب الأسبوعي والوصل ===== */

const up=n=>{const v=+$('#pd').value||0,m=n-v;$('#r_p').textContent=F(v);$('#r_l').textContent=m<0?'مرحّل على الموظف (يُقتطع من الراتب المقبل)':m>0?'المتبقي للموظف':'المتبقي';$('#r_m').textContent=F(Math.abs(m))};

async function bk(){const d={};ST.forEach(s=>d[s]=s=='cfg'?S[s].filter(x=>x.id!='pw'):S[s]);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));a.download='backup-'+today()+'.json';a.click();await sc('bk',today());go()}
async function rs(f){if(!f||!confirm('سيتم استبدال جميع البيانات الحالية بالنسخة المختارة. متابعة؟'))return;const d=JSON.parse(await f.text());for(const s of ST){for(const x of S[s])if(!(s=='cfg'&&x.id=='pw'))await del(s,x.id);for(const x of d[s]||[])if(!(s=='cfg'&&x.id=='pw'))await put(s,x)}await load();go();alert('تم الاسترجاع')}
